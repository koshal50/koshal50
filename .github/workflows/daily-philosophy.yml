name: Daily Philosophical Quote

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows you to trigger it manually

permissions:
  contents: write

jobs:
  refresh-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pick and Inject Quote
        run: |
          # Pick a random line from your curated quotes.txt file
          QUOTE=$(shuf -n 1 quotes.txt)
          echo "Selected Quote: $QUOTE"
          
          # Use perl to safely swap out the text between your target tags in the README
          perl -0777 -pi -e "s/(<!-- README_QUOTE_START -->).*?(<!-- README_QUOTE_END -->)/\$1\n\n> \$QUOTE\n\n\$2/s" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "Update daily philosophical quote"
          git push
